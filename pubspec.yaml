name: saju_app
description: A Flutter app for fortune telling using traditional Korean Saju (Four Pillars)
version: 1.0.3+70

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^5.0.0
  app_tracking_transparency: ^2.0.4
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  http: ^1.1.0
  connectivity_plus: ^6.0.3
  dio: ^5.0.0
  permission_handler: ^11.0.1
  # audioplayers: ^5.2.1  # 크래시 원인으로 제거
  path_provider: ^2.1.1
  path: ^1.9.0
  webview_flutter: ^4.7.0
  google_sign_in: 6.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  android_alarm_manager_plus: ^4.0.3
  # flutter_native_timezone: ^2.0.0  # Removed due to namespace issues with newer Android Gradle Plugin
  url_launcher: ^6.2.4
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.2
  share_plus: ^10.0.0
  supabase_flutter: ^2.10.0
  package_info_plus: ^8.3.1
  uuid: ^4.5.1
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  # google_maps_flutter: ^2.5.3  # Google Maps SDK 주석
  # geolocator: ^10.1.0  # 위치 권한 주석
  # geocoding: ^2.1.1  # 주소 변환 주석

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"               # 기본 아이콘
  adaptive_icon_foreground: "assets/icons/transparent.png" # 투명 PNG
  adaptive_icon_background: "#000000"         # 원하는 배경색 (또는 이미지)

flutter:
  uses-material-design: true
  generate: true  # 다국어 지원이 필요할 때 활성화
  assets:
    - assets/icons/
    - assets/design/
    - assets/data/
    - web/
    - web/icons/
  
